<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Paly — Study buddy</title>
  <meta name="description" content="Paly is your calm study buddy. Drop something confusing and get clarity you can use." />
  <style>
    :root {
      --bg: #f7f5f2;
      --surface: #ffffff;
      --ink: #2a2a32;
      --muted: #7a7785;
      --lavender: #b9a8e8;
      --lavender-soft: #efeafc;
      --peach: #f8e0d0;
      --mint: #d8efe6;
      --line: #ddd6f0;
      --shadow: 0 10px 30px rgba(90, 70, 140, 0.08);
      --radius: 22px;
      --phone-width: 390px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: "SF Pro Text", "Segoe UI", system-ui, -apple-system, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 50% -10%, #ebe4ff 0%, transparent 55%),
        radial-gradient(900px 500px at 80% 100%, #dff5ef 0%, transparent 50%),
        var(--bg);
      display: grid;
      place-items: center;
      min-height: 100%;
      padding: 24px 16px;
    }

    .phone {
      width: min(100%, var(--phone-width));
      min-height: 780px;
      background: var(--surface);
      border-radius: 36px;
      box-shadow: var(--shadow), 0 0 0 1px rgba(255,255,255,0.7) inset;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .screen {
      flex: 1;
      padding: 28px 22px 110px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .wordmark {
      text-align: center;
      font-size: 1.35rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin: 4px 0 0;
    }

    .buddy {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-top: 4px;
    }

    .buddy img {
      width: 148px;
      height: auto;
      filter: drop-shadow(0 12px 20px rgba(140, 120, 200, 0.25));
      animation: float 4.5s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .invite {
      margin: 0;
      text-align: center;
      color: var(--muted);
      font-size: 0.98rem;
      line-height: 1.35;
    }

    .capture {
      border: 2px dashed var(--lavender);
      background: linear-gradient(180deg, #fcfbff 0%, #f7f3ff 100%);
      border-radius: var(--radius);
      padding: 28px 18px;
      text-align: center;
      color: #6d5ea0;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.15s ease;
    }

    .capture:hover,
    .capture:focus-visible {
      background: var(--lavender-soft);
      outline: none;
    }

    .capture:active { transform: scale(0.99); }

    .capture-icon {
      width: 36px;
      height: 36px;
      margin: 0 auto 10px;
      color: #8b74d8;
    }

    .capture p {
      margin: 0;
      font-size: 0.95rem;
    }

    .section-label {
      margin: 6px 2px 0;
      font-size: 0.92rem;
      font-weight: 650;
      letter-spacing: -0.01em;
    }

    .scraps {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .scrap {
      display: grid;
      grid-template-columns: 48px 1fr;
      gap: 12px;
      align-items: start;
      padding: 14px;
      border-radius: 18px;
      box-shadow: 0 1px 0 rgba(255,255,255,0.7) inset;
    }

    .scrap.peach { background: var(--peach); }
    .scrap.mint { background: var(--mint); }

    .thumb {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: rgba(255,255,255,0.7);
      display: grid;
      place-items: center;
      color: #6a6478;
    }

    .scrap h3 {
      margin: 0 0 2px;
      font-size: 0.98rem;
      font-weight: 650;
      letter-spacing: -0.01em;
    }

    .scrap p {
      margin: 0 0 8px;
      color: #5d5868;
      font-size: 0.86rem;
      line-height: 1.3;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 600;
      background: rgba(255,255,255,0.65);
      color: #5a5568;
      text-transform: lowercase;
    }

    .tabbar {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: calc(14px + var(--safe-bottom));
      height: 68px;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(12px);
      border: 1px solid var(--line);
      border-radius: 22px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      padding: 8px;
      box-shadow: var(--shadow);
    }

    .tab {
      border: 0;
      background: transparent;
      border-radius: 16px;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
    }

    .tab svg { width: 22px; height: 22px; }
    .tab.active {
      background: var(--lavender-soft);
      color: #6d54b8;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      border: 0;
    }

    @media (max-width: 420px) {
      body { padding: 0; background: var(--surface); }
      .phone {
        width: 100%;
        min-height: 100dvh;
        border-radius: 0;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <main class="phone" aria-label="Paly home screen">
    <div class="screen">
      <h1 class="wordmark">Paly</h1>

      <section class="buddy" aria-label="Your study buddy">
        <img src="mascot.png" alt="Paly, a soft cloud study buddy" width="148" height="148" />
        <p class="invite">Got something confusing? Drop it here.</p>
      </section>

      <button class="capture" type="button" aria-label="Capture a study scrap">
        <svg class="capture-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h2l1.2-1.6A1.5 1.5 0 0 1 10.9 4h2.2a1.5 1.5 0 0 1 1.2.4L15.5 6h2A2.5 2.5 0 0 1 20 8.5v8A2.5 2.5 0 0 1 17.5 19h-11A2.5 2.5 0 0 1 4 16.5v-8Z" stroke="currentColor" stroke-width="1.6"/>
          <circle cx="12" cy="12.5" r="3.2" stroke="currentColor" stroke-width="1.6"/>
        </svg>
        <p>Photo, paste, or type a question…</p>
      </button>

      <h2 class="section-label">Open scraps</h2>
      <section class="scraps" aria-label="Open scraps">
        <article class="scrap peach">
          <div class="thumb" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none">
              <path d="M7 4h7l4 4v12H7V4Z" stroke="currentColor" stroke-width="1.6"/>
              <path d="M14 4v4h4" stroke="currentColor" stroke-width="1.6"/>
              <path d="M9 12h6M9 15h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
          </div>
          <div>
            <h3>Bio ch.4 — mitosis</h3>
            <p>I don't get the phases</p>
            <span class="pill">clarify</span>
          </div>
        </article>

        <article class="scrap mint">
          <div class="thumb" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none">
              <path d="M7 4h7l4 4v12H7V4Z" stroke="currentColor" stroke-width="1.6"/>
              <path d="M14 4v4h4" stroke="currentColor" stroke-width="1.6"/>
              <path d="M9 13h6M9 16h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
          </div>
          <div>
            <h3>Calc practice</h3>
            <p>Derivative of ln(x)?</p>
            <span class="pill">ready to ship</span>
          </div>
        </article>
      </section>
    </div>

    <nav class="tabbar" aria-label="Primary">
      <button class="tab active" type="button" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 11.5 12 5l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1v-8.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
        </svg>
        Home
      </button>
      <button class="tab" type="button">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M6 5h9a2 2 0 0 1 2 2v12l-2-1.2-2 1.2-2-1.2-2 1.2-2-1.2-2 1.2V7a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
          <path d="M9 9h6M9 12h6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
        Study
      </button>
      <button class="tab" type="button">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M7.5 16.5h9a4.5 4.5 0 0 0 .7-8.95A5.5 5.5 0 0 0 7.2 9.1 4 4 0 0 0 7.5 16.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
        </svg>
        Buddy
      </button>
    </nav>
  </main>
</body>
</html>
